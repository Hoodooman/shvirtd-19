events {
    worker_connections 1024;
}

http {
    upstream security {
        server security:3000;
    }

    upstream uploader {
        server uploader:3000;
    }

    upstream minio {
        server storage:9000;
    }

    # Валидация токена через security сервис
    map $http_authorization $valid_token {
        default "0";
        "~*" "1";
    }

    server {
        listen 8080;
        server_name localhost;

        # Анонимные endpoints
        location /v1/register {
            proxy_pass http://security/v1/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v1/token {
            proxy_pass http://security/v1/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Protected endpoints - требуют валидации токена
        location /v1/user {
            # Проверка токена через security сервис
            auth_request /v1/token/validation;
            auth_request_set $auth_status $upstream_status;

            proxy_pass http://security/v1/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        location /v1/upload {
            # Проверка токена через security сервис
            auth_request /v1/token/validation;
            auth_request_set $auth_status $upstream_status;

            proxy_pass http://uploader/v1/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # Для загрузки файлов
            client_max_body_size 100M;
            proxy_request_buffering off;
        }

        location ~ ^/v1/user/(?<image>.+)$ {
            # Проверка токена через security сервис
            auth_request /v1/token/validation;
            auth_request_set $auth_status $upstream_status;

            # Проксируем запрос в MinIO
            proxy_pass http://minio/images/$image;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # Настройки для S3
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Внутренний location для валидации токена
        location = /v1/token/validation {
            internal;
            proxy_pass http://security/v1/token/validation;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # Обработка ошибок аутентификации
        error_page 401 = @error401;
        error_page 403 = @error403;

        location @error401 {
            return 401 '{"error": "Unauthorized", "message": "Invalid or missing token"}';
            add_header Content-Type application/json;
        }

        location @error403 {
            return 403 '{"error": "Forbidden", "message": "Access denied"}';
            add_header Content-Type application/json;
        }
    }
}
