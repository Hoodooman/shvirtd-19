version: '3.8'

volumes:
  data:
  prometheus-data:
  grafana_data:

networks:
  app-network:
    driver: bridge

services:
  storage:
    image: minio/minio:latest
    command: server /data
    restart: always
    expose: 
      - 9000
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc
    depends_on:
      storage:
        condition: service_healthy
    restart: on-failure
    entrypoint: > 
      /bin/sh -c "      
      /usr/bin/mc alias set storage http://storage:9000 $${STORAGE_ACCESS_KEY:-minioadmin} $${STORAGE_SECRET_KEY:-minioadmin} &&
      /usr/bin/mc mb --ignore-existing storage/images &&
      /usr/bin/mc anonymous set download storage/images &&
      exit 0;
      "
    networks:
      - app-network

  uploader:
    build: ./uploader
    depends_on:
      - storage
      - createbuckets
    expose: 
      - 3000
    environment:
      PORT: 3000
      S3_HOST: storage
      S3_PORT: 9000
      S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      S3_ACCESS_SECRET: ${STORAGE_SECRET_KEY:-minioadmin}
      S3_BUCKET: images
    networks:
      - app-network

  security:
    build: ./security
    expose: 
      - 3000
    environment:
      PORT: 3000
    networks:
      - app-network

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:8080"      
    depends_on:
      - storage
      - uploader
      - security
    networks:
      - app-network
