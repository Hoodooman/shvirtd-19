apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-multitool
  namespace: shkube-hw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tsk3
  template:
    metadata:
      labels:
        app: tsk3
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.4
        ports:
        - containerPort: 80
      - name: multitool
        image: wbitt/network-multitool
        ports:
        - containerPort: 1180
        env:   # Исправляем ошибку конфликта портов nginx
        - name: HTTP_PORT
          value: "1180" 
