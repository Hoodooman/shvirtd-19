#cloud-config
users:
  - name: ubuntu
    groups: sudo
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
${ssh_keys}

package_update: true
package_upgrade: true
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - git

runcmd:
  #Обновление пакетов:
  - sudo apt update
  #Установка Python:
  - sudo apt install python3.10-venv python3.10-dev -y
  ## Общая настройка узлов
  - sudo swapoff -a
  - sudo sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab
  # Настройка параметров ядра
  - |
    cat <<EOF | sudo tee /etc/sysctl.d/k8s.conf
    net.bridge.bridge-nf-call-ip6tables = 1
    net.bridge.bridge-nf-call-iptables = 1
    net.ipv4.ip_forward = 1
    EOF
  - sudo sysctl --system
  # Загрузка модуля bridge netfilter
  - sudo modprobe br_netfilter
  - echo 'br_netfilter' | sudo tee /etc/modules-load.d/k8s.conf
  ## Установка ansible
    # Запуск команд от имени пользователя ubuntu
  - |
    sudo -i -u ubuntu bash <<EOF
    git clone https://github.com/kubernetes-sigs/kubespray.git
    cd kubespray
    python3 -m venv venv
    . venv/bin/activate
    pip install -r requirements.txt
    mkdir -p /home/ubuntu/kubespray/inventory/mycluster
    mkdir -p /home/ubuntu/kubespray/inventory/mycluster/group_vars
    cat <<EOF | tee /home/ubuntu/kubespray/inventory/mycluster/group_vars/k8s_cluster.yml
    # HTTP proxy for all nodes
    http_proxy: "http://$(ip addr show eth0 | grep 'inet ' | awk '{print $2}' | cut -d/ -f1):3128"  # Use master-0's internal IP
    https_proxy: "http://$(ip addr show eth0 | grep 'inet ' | awk '{print $2}' | cut -d/ -f1):3128"
    no_proxy: "localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,10.96.0.0/12"

    # Configure containerd to use proxy
    containerd_use_http_proxy: true
    EOF
    echo 'Ansible ready to rock stady' > /home/ubuntu/install_complete.txt
    EOF