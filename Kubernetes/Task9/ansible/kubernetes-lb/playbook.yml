---
- name: Configure Kubernetes Load Balancer with Keepalived and HAProxy
  hosts: control_nodes
  become: yes
  vars:
    virtual_router_id: 51
  tasks:
    - name: Install keepalived and haproxy
      apt:
        name:
          - keepalived
          - haproxy
        state: present
        update_cache: yes

    - name: Create HAProxy configuration
      template:
        src: haproxy.cfg.j2
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: 0644
      notify: restart haproxy

    - name: Create Keepalived configuration
      template:
        src: keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: 0644
      notify: restart keepalived

    - name: Enable and start HAProxy
      systemd:
        name: haproxy
        enabled: yes
        state: started

    - name: Validate HAProxy configuration
      command: haproxy -f /etc/haproxy/haproxy.cfg -c
      register: haproxy_check
      failed_when: haproxy_check.rc != 0
    
    - name: Restart HAProxy if config is valid
      systemd:
        name: haproxy
        state: restarted
      when: haproxy_check.rc == 0        

    - name: Enable and start Keepalived
      systemd:
        name: keepalived
        enabled: yes
        state: started

  handlers:
    - name: restart haproxy
      systemd:
        name: haproxy
        state: restarted

    - name: restart keepalived
      systemd:
        name: keepalived
        state: restarted